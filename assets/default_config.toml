[game]
# Games with up to 8 players are supported
min_players = 2
max_players = 2
# Whether the map is symmetric for all the players.
# if 'symmetric' = true CG Arena will play 1 match per seed.
# if 'symmetric' = false CG Arena will play n! matches per seed, where n is the amount of players.
symmetric = true
referee_git_url = ""

[matchmaking]
algorithm = "v2"
min_matches_per_pair = 100
max_matches = 1000

# supported algorithms: ["OpenSkill", "TrueSkill", "Elo", "BradleyTerry"]
[ranking]
algorithm = "BradleyTerry"

# 'port' controls web server port. If 'port' is omitted then OS assigns some available port
# 'expose' controls whether to expose web server to the local network
[server]
port = 1234
expose = false

[log]
level = "INFO"
file = "cgarena.log"

# one embedded worker is currently supported; threads controls concurrent matches.
# `referee` selects exactly one match/replay integration:
# - codingame_jar runs a compatible shaded CodinGame JAR directly.
# - command preserves the custom referee command contract.
# codingame_jar requires -p1..-p8, -seed, -l, -r, -port, and --cgarena-compat.
# cmd_build builds a bot and cmd_run returns its complete command line.
# 'cmd_build' should output bot's executable to the same folder
[[workers]]
type = "embedded"
threads = 1
cmd_build = "g++ -std=c++20 -x c++ {DIR}/source.txt -o {DIR}/a"
cmd_run = "./{DIR}/a"

[workers.referee]
type = "codingame_jar"
path = "referee/target/referee.jar"


# or a generic version
# cmd_run = "sh run.sh {DIR} {LANG}"
# cmd_build = "sh build.sh {DIR} {LANG}"
